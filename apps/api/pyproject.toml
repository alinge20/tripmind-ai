[project]
name = "tripmind-api"
version = "0.1.0"
description = "Backend de TripMind AI: reglas de negocio, IA e integraciones."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.143,<1.0",
    "uvicorn[standard]>=0.54,<1.0",
    "pydantic>=2.14,<3.0",
    "pydantic-settings>=2.16,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
    "httpx>=0.28,<1.0",
    "ruff>=0.17,<1.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
